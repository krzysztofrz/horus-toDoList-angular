<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0">Lista zadań</h1>
    <button class="btn btn-primary" type="button" (click)="onOpenAddModal()" aria-label="Dodaj nowe zadanie">
      Dodaj zadanie
    </button>
  </div>

  <app-task-filters [filters]="filters()" [isDateRangeInvalid]="isDateRangeInvalid()"
    (filtersChange)="onFiltersChange($event)" (clearFilters)="onClearFilters()">
  </app-task-filters>

  <app-task-list [tasks]="filteredTasks()" (toggleCompleted)="onToggleCompleted($event)"
    (editTask)="onEditTask($event)">
  </app-task-list>

  <app-add-task-modal [isOpen]="isAddModalOpen()" [formData]="newTaskForm()" (close)="onCloseAddModal()"
    (submit)="onAddTask($event)">
  </app-add-task-modal>

  <app-edit-task-modal [isOpen]="isEditModalOpen()" [task]="editingTask()" [formData]="editTaskForm()"
    (close)="onCloseEditModal()" (submit)="onEditTaskSubmit($event)">
  </app-edit-task-modal>
</div>
