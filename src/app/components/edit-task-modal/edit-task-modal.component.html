@if (isOpen) {
<div class="modal-backdrop" (click)="onClose()"></div>
<div class="modal d-block" role="dialog" aria-modal="true" aria-labelledby="editTaskTitle" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" (click)="$event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title h5" id="editTaskTitle">Edytuj zadanie</h2>
                <button type="button" class="btn-close" aria-label="Zamknij" (click)="onClose()"></button>
            </div>
            <form (submit)="$event.preventDefault(); onSubmit()" novalidate>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editTaskName" class="form-label">Nazwa</label>
                        <input id="editTaskName" type="text" class="form-control" [(ngModel)]="formData.name"
                            name="editTaskName" required [class.is-invalid]="isNameInvalid"
                            placeholder="Wpisz nazwę zadania"
                            [attr.aria-describedby]="isNameInvalid ? 'editTaskNameError' : null" />
                        @if (isNameInvalid) {
                        <div id="editTaskNameError" class="invalid-feedback">Nazwa jest wymagana.</div>
                        }
                    </div>

                    <div class="mb-3">
                        <label for="editTaskDate" class="form-label">Data</label>
                        <input id="editTaskDate" type="date" class="form-control" [(ngModel)]="formData.date"
                            name="editTaskDate" required [min]="todayISO" [class.is-invalid]="isDateInvalid"
                            [attr.aria-describedby]="isDateInvalid ? 'editTaskDateError' : null" />
                        @if (isDateInvalid) {
                        <div id="editTaskDateError" class="invalid-feedback">Data jest wymagana i nie może być przeszła.
                        </div>
                        }
                    </div>

                    <div class="mb-3">
                        <label for="editTaskStatus" class="form-label">Status</label>
                        <select id="editTaskStatus" class="form-select" [(ngModel)]="formData.status"
                            name="editTaskStatus">
                            <option [ngValue]="TaskStatus.Planned">Planned</option>
                            <option [ngValue]="TaskStatus.Pending">Pending</option>
                            <option [ngValue]="TaskStatus.Completed">Completed</option>
                        </select>
                    </div>

                    <div class="mb-0">
                        <label for="editTaskDesc" class="form-label">Opis</label>
                        <textarea id="editTaskDesc" rows="3" class="form-control" [(ngModel)]="formData.description"
                            name="editTaskDesc" placeholder="Krótki opis"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" (click)="onClose()">Anuluj</button>
                    <button type="submit" class="btn btn-primary">Zapisz</button>
                </div>
            </form>
        </div>
    </div>
</div>
}
